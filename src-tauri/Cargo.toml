[package]
name = "openbricx-console"
version = "1.0.0"
description = "OpenBricx Console — cross-platform hardware hub"
authors = ["Apurv Arya"]
# GPL-3.0 with a plugin linking exception — see LICENSE-EXCEPTION.md at the repo
# root. SPDX has no expression for the exception, so the plain id is used here.
license = "GPL-3.0-only"
repository = "https://github.com/OpenBricx/OpenBricx-Console"
default-run = "openbricx-console"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openbricx_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["net", "sync", "macros"] }
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
serialport = "4"
btleplug = "0.11"
espflash = { version = "3", default-features = false, features = ["serialport"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
sysinfo = "0.32"
open = "5"
ed25519-dalek = "2"
sha2 = "0.10"
zip = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
